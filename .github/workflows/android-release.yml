name: Android Release

on:
  push:
    branches:
      - fix/foco-audio-llamada
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Fix upstream ProgressiveMediaSource merge issue in CI
      run: |
        python3 -c '
        from pathlib import Path
        p = Path("media/libraries/exoplayer/src/main/java/androidx/media3/exoplayer/source/ProgressiveMediaSource.java")
        text = p.read_text()
        text = text.replace("      boolean enableHagcPlayback = experimentalEnableHagcPlayback;\n", "")
        text = text.replace("                  enableHagcPlayback,\n", "")
        p.write_text(text)
        '
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build unsigned release APK with Gradle
      run: ./gradlew app:assembleRelease
    - name: Sign release APK with generic keystore
      run: |
        keytool -genkeypair -v \
          -keystore release.jks \
          -alias auxio \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Auxio, OU=Dev, O=Auxio, L=Unknown, S=Unknown, C=US"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
        ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
        "$ZIPALIGN" -p -f 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          app/build/outputs/apk/release/app-release-aligned.apk
        "$APKSIGNER" sign \
          --ks release.jks \
          --ks-pass pass:android \
          --key-pass pass:android \
          --ks-key-alias auxio \
          --out app/build/outputs/apk/release/Auxio-release-signed.apk \
          app/build/outputs/apk/release/app-release-aligned.apk
        "$APKSIGNER" verify --verbose app/build/outputs/apk/release/Auxio-release-signed.apk
    - name: Upload signed release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Release_Signed
        path: ./app/build/outputs/apk/release/Auxio-release-signed.apk
